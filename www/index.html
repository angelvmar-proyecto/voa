<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAR Caribe - Mi Inglés VOA</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header>
  <h1>🎧 Mi Inglés VOA</h1>
  <div class="sub">por MAR Caribe · Cancún</div>
</header>

<div class="tabs">
  <button id="tab-lecciones" class="activo" onclick="cambiarTab('lecciones')">📚 Let's Learn</button>
  <button id="tab-entrevistas" onclick="cambiarTab('entrevistas')">🎤 Entrevistas</button>
  <button id="tab-turismo" onclick="cambiarTab('turismo')">🌴 Turismo</button>
</div>

<div id="contenido-lecciones" class="contenido activo">
  <div class="barra">
    <button onclick="actualizarBiblioteca('lecciones')">🔄 Cargar lista de lecciones</button>
    <button class="sec" onclick="borrarBiblioteca('lecciones')">🗑️</button>
    <button class="sec" onclick="borrarTextos('lecciones')" title="Borrar textos">🧹</button>
    <button class="sec" onclick="verEstructuraDialogo()" title="Diagnóstico">🔬</button>
  </div>
  <div id="estado-lecciones" style="display:none"></div>
  <div id="lista-lecciones"><div class="vacio">Toca "Cargar lista" para empezar</div></div>
</div>

<div id="contenido-entrevistas" class="contenido">
  <div class="barra">
    <button onclick="actualizarBiblioteca('entrevistas')">🔄 Actualizar biblioteca</button>
    <button class="sec" onclick="borrarBiblioteca('entrevistas')">🗑️</button>
    <button class="sec" onclick="borrarTextos('entrevistas')" title="Borrar textos">🧹</button>
  </div>
  <div id="estado-entrevistas" style="display:none"></div>
  <div id="lista-entrevistas"><div class="vacio">Toca "Actualizar biblioteca" para empezar</div></div>
</div>

<div id="contenido-turismo" class="contenido">
  <div class="barra">
    <button onclick="cargarTurismo()">🔄 Escanear carpeta Turismo</button>
  </div>
  <div class="ruta" id="ruta-turismo">Cargando ruta...</div>
  <div id="estado-turismo" style="display:none"></div>
  <div id="lista-turismo"><div class="vacio">Toca "Escanear carpeta Turismo"</div></div>
</div>

<footer>
  Contenido educativo de <a href="https://learningenglish.voanews.com" target="_blank">VOA Learning English</a> (dominio público).<br>
  App desarrollada por <span class="marca">MAR Caribe</span> · Cancún, México
</footer>

<script src="js/utils.js"></script>
<script src="js/archivos.js"></script>
<script src="js/red.js"></script>
<script src="js/voa.js"></script>
<script src="js/diag.js"></script>
<script src="js/diag2.js"></script>
<script src="js/turismo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
