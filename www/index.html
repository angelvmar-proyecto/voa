<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAR Caribe - Mi Inglés VOA</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 0;
         background: #f5f7fa; color: #222; padding-bottom: 90px; }
  header { background: #1e40af; color: #fff; padding: 14px 16px;
           position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 19px; margin: 0; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e2e8f0;
          position: sticky; top: 60px; z-index: 9; }
  .tabs button { flex: 1; padding: 14px 8px; border: 0; background: transparent;
                 font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer;
                 border-bottom: 3px solid transparent; }
  .tabs button.activo { color: #1e40af; border-bottom-color: #1e40af; }
  .contenido { display: none; padding: 12px; }
  .contenido.activo { display: block; }
  .barra { display: flex; gap: 8px; margin-bottom: 12px; }
  .barra button { flex: 1; background: #2563eb; color: #fff; border: 0;
                  border-radius: 10px; padding: 13px; font-size: 15px;
                  font-weight: 600; cursor: pointer; }
  .barra button.sec { flex: 0 0 56px; background: #64748b; }
  .barra button:disabled { opacity: .6; }
  .estado { background: #fef3c7; color: #78350f; padding: 10px 12px;
            border-radius: 8px; font-size: 14px; margin-bottom: 10px;
            word-break: break-word; }
  .estado.ok { background: #dcfce7; color: #14532d; }
  .estado.err { background: #fee2e2; color: #7f1d1d; }
  .item { background: #fff; border-radius: 12px; padding: 12px;
          margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .item h3 { font-size: 15px; margin: 0 0 6px; line-height: 1.3; }
  .item .meta { font-size: 12px; color: #64748b; margin-bottom: 8px; }
  .item .acciones { display: flex; gap: 6px; }
  .item button { flex: 1; padding: 10px 6px; border: 0; border-radius: 8px;
                 font-size: 13px; cursor: pointer; font-weight: 600; }
  .item .desc { background: #2563eb; color: #fff; }
  .item .desc.guardado { background: #16a34a; }
  .item .play { background: #e2e8f0; color: #1e293b; }
  .item .texto { background: #f59e0b; color: #fff; }
  .item audio { width: 100%; margin-top: 8px; }
  .texto-box { background: #fffbeb; border: 1px solid #fcd34d;
               border-radius: 8px; padding: 12px; margin-top: 8px;
               white-space: pre-wrap; line-height: 1.6; font-size: 15px;
               max-height: 400px; overflow-y: auto; }
  .vacio { text-align: center; color: #94a3b8; padding: 40px 16px; font-size: 15px; }
  .spinner { display: inline-block; width: 12px; height: 12px;
             border: 2px solid #fff; border-top-color: transparent;
             border-radius: 50%; animation: giro .8s linear infinite;
             vertical-align: middle; margin-right: 4px; }
  @keyframes giro { to { transform: rotate(360deg); } }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b;
           color: #cbd5e1; font-size: 11px; padding: 8px 12px; text-align: center;
           line-height: 1.4; }
  footer a { color: #93c5fd; text-decoration: none; }
  footer .marca { color: #fbbf24; font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>🎧 Mi Inglés VOA</h1>
  <div class="sub">por MAR Caribe · Cancún</div>
</header>

<div class="tabs">
  <button id="tab-lecciones" class="activo" onclick="cambiarTab('lecciones')">📚 Lecciones</button>
  <button id="tab-entrevistas" onclick="cambiarTab('entrevistas')">🎤 Entrevistas</button>
</div>

<div id="contenido-lecciones" class="contenido activo">
  <div class="barra">
    <button onclick="actualizarBiblioteca('lecciones')">🔄 Actualizar biblioteca</button>
    <button class="sec" onclick="borrarBiblioteca('lecciones')">🗑️</button>
  </div>
  <div id="estado-lecciones" style="display:none"></div>
  <div id="lista-lecciones"><div class="vacio">Toca "Actualizar biblioteca" para empezar</div></div>
</div>

<div id="contenido-entrevistas" class="contenido">
  <div class="barra">
    <button onclick="actualizarBiblioteca('entrevistas')">🔄 Actualizar biblioteca</button>
    <button class="sec" onclick="borrarBiblioteca('entrevistas')">🗑️</button>
  </div>
  <div id="estado-entrevistas" style="display:none"></div>
  <div id="lista-entrevistas"><div class="vacio">Toca "Actualizar biblioteca" para empezar</div></div>
</div>

<footer>
  Contenido educativo de <a href="https://learningenglish.voanews.com" target="_blank">VOA Learning English</a> (dominio público).<br>
  App desarrollada por <span class="marca">MAR Caribe</span> · Cancún, México
</footer>

<script>
// ================================================================
// FEEDS RSS DE VOA LEARNING ENGLISH
// Cambia estas URLs si quieres otras secciones.
// ================================================================
var FEEDS = {
  lecciones:   'https://learningenglish.voanews.com/podcast/?count=20&zoneId=1689',
  entrevistas: 'https://learningenglish.voanews.com/podcast/?zoneId=1579'
};
// ================================================================

var Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
var Filesystem = Plugins.Filesystem;
var Directory = {
  Data: 'DATA',
  Documents: 'DOCUMENTS',
  Cache: 'CACHE',
  External: 'EXTERNAL'
};

var CARPETA_AUDIOS = 'audios/';
var CARPETA_TEXTOS = 'textos/';

// ---------- Archivos ----------
async function guardarJSON(nombre, datos) {
  await Filesystem.writeFile({
    path: nombre, data: JSON.stringify(datos),
    directory: Directory.External, encoding: 'utf8'
  });
}

async function leerJSON(nombre) {
  try {
    var r = await Filesystem.readFile({
      path: nombre, directory: Directory.External, encoding: 'utf8'
    });
    return JSON.parse(r.data);
  } catch (e) { return null; }
}

async function leerTexto(nombre) {
  try {
    var r = await Filesystem.readFile({
      path: nombre, directory: Directory.External, encoding: 'utf8'
    });
    return r.data;
  } catch (e) { return null; }
}

async function existeArchivo(nombre) {
  try {
    await Filesystem.stat({ path: nombre, directory: Directory.External });
    return true;
  } catch (e) { return false; }
}

// ---------- Descarga ----------
async function bajar(url, comoTexto) {
  if (Plugins.CapacitorHttp) {
    var opts = { url: url, headers: { 'User-Agent': 'Mozilla/5.0' } };
    if (!comoTexto) opts.responseType = 'arraybuffer';
    var r = await Plugins.CapacitorHttp.get(opts);
    if (r.status >= 400) throw new Error('HTTP ' + r.status);
    if (comoTexto) {
      return typeof r.data === 'string' ? r.data : JSON.stringify(r.data);
    }
    return r.data;
  }
  var res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return comoTexto ? await res.text() : await res.arrayBuffer();
}

// ---------- Extraer texto de la lección ----------
function extraerTexto(html) {
  try {
    var doc = new DOMParser().parseFromString(html, 'text/html');

    // Probar selectores comunes de VOA
    var art = doc.querySelector('.wsw') ||
              doc.querySelector('#article-content') ||
              doc.querySelector('.article-content') ||
              doc.querySelector('article') ||
              doc.querySelector('main');

    var texto = art ? art.innerText : doc.body.innerText;

    // Limpieza
    texto = texto
      .replace(/\r/g, '')
      .split('\n')
      .map(function(l) { return l.trim(); })
      .filter(function(l) {
        if (!l) return false;
        if (/^Download Lesson/i.test(l)) return false;
        if (/^Your browser doesn/i.test(l)) return false;
        if (/^Quiz - Lesson/i.test(l)) return false;
        if (/^\d{1,2}:\d{2}/.test(l)) return false;
        if (/^Speaking Practice$/i.test(l)) return false;
        if (/^Pronunciation( Practice)?$/i.test(l)) return false;
        if (/^Conversation$/i.test(l)) return false;
        if (/^Learn the alphabet$/i.test(l)) return false;
        if (/^Listening Quiz$/i.test(l)) return false;
        if (/^Video$/i.test(l)) return false;
        if (/^Audio$/i.test(l)) return false;
        if (/^Follow Us$/i.test(l)) return false;
        if (/^Related$/i.test(l)) return false;
        if (/^About Learning English$/i.test(l)) return false;
        return true;
      })
      .join('\n');

    texto = texto.replace(/\n{3,}/g, '\n\n').trim();

    // Cortar todo después de "Related" / "Follow Us"
    var cortes = [/\nRelated\s*\n/i, /\nFollow Us\s*\n/i, /\nAbout Learning English\s*\n/i];
    for (var i = 0; i < cortes.length; i++) {
      var m = texto.search(cortes[i]);
      if (m > 200) { texto = texto.slice(0, m).trim(); break; }
    }

    return texto;
  } catch (e) {
    return '';
  }
}

// ---------- RSS ----------
function limpiar(s) { return (s || '').replace(/<!\[CDATA\[|\]\]>/g, '').trim(); }

function parsearRSS(xml) {
  var items = xml.match(/<item[\s>][\s\S]*?<\/item>/g) || [];
  return items.map(function(it) {
    var t = it.match(/<title>([\s\S]*?)<\/title>/);
    var mp3 = it.match(/<enclosure[^>]+url=["']([^"']+\.mp3)["']/i) ||
              it.match(/<media:content[^>]+url=["']([^"']+\.mp3)["']/i) ||
              it.match(/(https?:\/\/[^\s"'<>\\]+\.mp3)/i);
    var link = it.match(/<link>([\s\S]*?)<\/link>/);
    var pub = it.match(/<pubDate>([\s\S]*?)<\/pubDate>/);
    if (!t || !mp3) return null;
    return {
      titulo: limpiar(t[1]),
      mp3: limpiar(mp3[1].replace(/\\\//g, '/')),
      pagina: link ? limpiar(link[1]) : null,
      fecha: pub ? limpiar(pub[1]) : ''
    };
  }).filter(Boolean);
}

// ---------- UI ----------
window.cambiarTab = function(tab) {
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('activo'); });
  document.querySelectorAll('.contenido').forEach(function(c) { c.classList.remove('activo'); });
  document.getElementById('tab-' + tab).classList.add('activo');
  document.getElementById('contenido-' + tab).classList.add('activo');
  cargarVista(tab);
};

function setEstado(tab, msg, tipo) {
  var el = document.getElementById('estado-' + tab);
  el.className = 'estado ' + (tipo || '');
  el.innerHTML = msg || '';
  el.style.display = msg ? 'block' : 'none';
}

function formatearFecha(s) {
  if (!s) return '';
  try {
    var d = new Date(s);
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch (e) { return ''; }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---------- Biblioteca ----------
window.actualizarBiblioteca = async function(tab) {
  var boton = document.querySelector('#contenido-' + tab + ' .barra button');
  boton.disabled = true;
  var textoOriginal = boton.innerHTML;
  boton.innerHTML = '<span class="spinner"></span> Descargando...';
  setEstado(tab, '📡 Consultando el feed...');

  try {
    var sep = FEEDS[tab].indexOf('?') >= 0 ? '&' : '?';
    var url = FEEDS[tab] + sep + '_=' + Date.now();
    var xml = await bajar(url, true);
    var items = parsearRSS(xml);
    if (!items.length) throw new Error('El feed no contiene episodios');
    await guardarJSON('biblioteca_' + tab + '.json', items);
    setEstado(tab, '✅ ' + items.length + ' episodios disponibles', 'ok');
    await cargarVista(tab);
  } catch (e) {
    setEstado(tab, '❌ Error: ' + e.message, 'err');
  } finally {
    boton.disabled = false;
    boton.innerHTML = textoOriginal;
  }
};

window.borrarBiblioteca = async function(tab) {
  if (!confirm('¿Borrar la biblioteca de ' + tab + '?')) return;
  try {
    await Filesystem.deleteFile({
      path: 'biblioteca_' + tab + '.json',
      directory: Directory.External
    });
  } catch (e) {}
  setEstado(tab, '');
  document.getElementById('lista-' + tab).innerHTML =
    '<div class="vacio">Biblioteca borrada. Toca "Actualizar biblioteca"</div>';
};

async function cargarVista(tab) {
  var lista = document.getElementById('lista-' + tab);
  var items = await leerJSON('biblioteca_' + tab + '.json');
  if (!items || !items.length) {
    lista.innerHTML = '<div class="vacio">Sin episodios. Toca "Actualizar biblioteca".</div>';
    return;
  }
  lista.innerHTML = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var rutaAudio = CARPETA_AUDIOS + 'l' + i + '.mp3';
    var rutaTexto = CARPETA_TEXTOS + 'l' + i + '.txt';
    var guardado = await existeArchivo(rutaAudio);
    var tieneTexto = await existeArchivo(rutaTexto);

    var div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<h3>' + escapeHtml(it.titulo) + '</h3>' +
      '<div class="meta">' + formatearFecha(it.fecha) + '</div>' +
      '<div class="acciones">' +
        '<button class="desc ' + (guardado ? 'guardado' : '') + '" ' +
                'data-tab="' + tab + '" data-i="' + i + '" ' +
                'data-mp3="' + escapeHtml(it.mp3) + '" ' +
                'data-pagina="' + escapeHtml(it.pagina || '') + '" ' +
                'data-ruta-audio="' + rutaAudio + '" ' +
                'data-ruta-texto="' + rutaTexto + '">' +
          (guardado ? '✅ Guardado' : '⬇️ Descargar') +
        '</button>' +
        '<button class="play" data-tab="' + tab + '" data-i="' + i + '">▶️ Audio</button>' +
        '<button class="texto ' + (tieneTexto ? '' : 'pendiente') + '" ' +
                'data-tab="' + tab + '" data-i="' + i + '" ' +
                'data-ruta-texto="' + rutaTexto + '" ' +
                'data-pagina="' + escapeHtml(it.pagina || '') + '">' +
          (tieneTexto ? '📖 Texto' : '📄 Bajar txt') +
        '</button>' +
      '</div>' +
      '<div id="rep_' + tab + '_' + i + '"></div>' +
      '<div id="txt_' + tab + '_' + i + '"></div>';
    lista.appendChild(div);
  }
}

// ---------- Clicks ----------
document.addEventListener('click', async function(e) {
  var boton = e.target.closest('button');
  if (!boton) return;

  // === DESCARGAR (audio + texto automáticamente) ===
  if (boton.classList.contains('desc')) {
    var mp3Url = boton.dataset.mp3;
    var pagina = boton.dataset.pagina;
    var rutaAudio = boton.dataset.rutaAudio;
    var rutaTexto = boton.dataset.rutaTexto;
    boton.disabled = true;
    boton.innerHTML = '<span class="spinner"></span> Bajando...';

    try {
      // 1) Bajar MP3
      var base64 = await bajar(mp3Url, false);
      await Filesystem.writeFile({
        path: rutaAudio, data: base64, directory: Directory.External
      });

      // 2) Bajar texto de la página de la lección
      if (pagina) {
        try {
          boton.innerHTML = '<span class="spinner"></span> Texto...';
          var html = await bajar(pagina, true);
          var texto = extraerTexto(html);
          if (texto && texto.length > 100) {
            await Filesystem.writeFile({
              path: rutaTexto, data: texto,
              directory: Directory.External, encoding: 'utf8'
            });
          }
        } catch (errTxt) {
          console.log('Sin texto:', errTxt.message);
        }
      }

      boton.classList.add('guardado');
      boton.innerHTML = '✅ Guardado';
      boton.disabled = false;
      await cargarVista(boton.dataset.tab);
    } catch (err) {
      boton.innerHTML = '❌ Reintentar';
      boton.disabled = false;
      alert('Error al descargar: ' + err.message);
    }
  }

  // === REPRODUCIR AUDIO ===
  if (boton.classList.contains('play')) {
    var tabA = boton.dataset.tab;
    var iA = boton.dataset.i;
    var cont = document.getElementById('rep_' + tabA + '_' + iA);
    var rutaArchivo = CARPETA_AUDIOS + 'l' + iA + '.mp3';

    if (cont.innerHTML) {
      cont.innerHTML = '';
      boton.innerHTML = '▶️ Audio';
      return;
    }

    boton.disabled = true;
    try {
      var src;
      if (await existeArchivo(rutaArchivo)) {
        var r = await Filesystem.readFile({
          path: rutaArchivo, directory: Directory.External
        });
        src = 'data:audio/mpeg;base64,' + r.data;
      } else {
        var itemsA = await leerJSON('biblioteca_' + tabA + '.json');
        src = itemsA[iA].mp3;
      }
      cont.innerHTML = '<audio controls autoplay src="' + src + '"></audio>';
      boton.innerHTML = '⏸️ Ocultar';
    } catch (err) {
      boton.innerHTML = '▶️ Audio';
      alert('Error: ' + err.message);
    }
    boton.disabled = false;
  }

  // === MOSTRAR / BAJAR TEXTO ===
  if (boton.classList.contains('texto')) {
    var tabT = boton.dataset.tab;
    var iT = boton.dataset.i;
    var contT = document.getElementById('txt_' + tabT + '_' + iT);
    var rutaT = boton.dataset.rutaTexto;
    var paginaT = boton.dataset.pagina;

    if (contT.innerHTML) {
      contT.innerHTML = '';
      return;
    }

    boton.disabled = true;
    var texto = await leerTexto(rutaT);

    // Si no está descargado, bajarlo ahora
    if (!texto && paginaT) {
      boton.innerHTML = '<span class="spinner"></span> Bajando...';
      try {
        var htmlT = await bajar(paginaT, true);
        texto = extraerTexto(htmlT);
        if (texto && texto.length > 50) {
          await Filesystem.writeFile({
            path: rutaT, data: texto,
            directory: Directory.External, encoding: 'utf8'
          });
          boton.innerHTML = '📖 Texto';
        }
      } catch (err) {
        texto = 'Error al bajar el texto: ' + err.message;
      }
    }

    if (texto) {
      contT.innerHTML = '<div class="texto-box">' + escapeHtml(texto) + '</div>';
    } else {
      contT.innerHTML = '<div class="texto-box">No hay texto disponible.</div>';
    }
    boton.disabled = false;
  }
});

cargarVista('lecciones');
cargarVista('entrevistas');
</script>
</body>
</html>
