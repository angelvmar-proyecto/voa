name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      # ================= DECODIFICAR KEYSTORE =================
      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/mi-clave.jks
          ls -la android/app/mi-clave.jks

      # ================= CONFIGURAR FIRMA =================
      - name: Configurar firma en build.gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android/app
          
          # Agregar configuración de firma al build.gradle
          python3 << 'PYTHON_EOF'
          import re
          
          with open('build.gradle', 'r') as f:
              content = f.read()
          
          # Insertar signingConfigs antes de buildTypes
          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("mi-clave.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """
          
          # Insertar antes de buildTypes
          if 'buildTypes' in content and 'signingConfigs' not in content:
              content = content.replace('buildTypes {', signing_config + '\n    buildTypes {')
              
              # Aplicar signingConfig al release
              content = re.sub(
                  r'(release\s*\{[^}]*)(proguardFiles)',
                  r'\1signingConfig signingConfigs.release\n            \2',
                  content
              )
          
          with open('build.gradle', 'w') as f:
              f.write(content)
          
          print("✅ build.gradle actualizado")
          PYTHON_EOF
          
          # Verificar
          grep -A 5 "signingConfigs" build.gradle

      # ================= COMPILAR APK RELEASE =================
      - name: Compilar APK Release firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # ================= SUBIR APK =================
      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: voa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # ================= INFO DEL APK =================
      - name: Mostrar info del APK
        run: |
          ls -la android/app/build/outputs/apk/release/
